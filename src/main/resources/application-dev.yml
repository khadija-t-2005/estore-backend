server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/estore_dev?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: create-drop  # Crée la BD à chaque démarrage en dev
    show-sql: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/estore_dev

logging:
  level:
    root: DEBUG
    com.estore: DEBUG